[package]
name = "braidpool_template_provider"
description = "Braidpool's template provider that wraps node's IPC client for SV2 Template Distribution Protocol"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Braidpool Developers"]
readme = "README.md"
keywords = ["stratum", "mining", "bitcoin", "braidpool"]

[dependencies]
tracing = "0.1.41"
tokio = { version = "1.44.1", features = ["full"] }
tokio-util = { version = "0.7.10", features = ["codec", "compat"] }
async-channel = "1.5.1"

# Using local stratum-core for cpunet modifications
stratum-core = { path = "../stratum-core" }
braidpool-common = { path = "../braidpool-common" }

# Node crate for IPC client and template functionality
node = { path = "../node" }

# Bitcoin types
bitcoin = { workspace = true }
