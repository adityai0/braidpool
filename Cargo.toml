#Virtual workspace not creating a root package along with workspace as not needed .
[workspace]
members = ["node", "pool", "translator", "stratum-apps","stratum-core", "braidpool-common"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
braidpool-common = { path = "braidpool-common" }
hex = "0.4"
capnp = "0.24.0"
capnp-rpc = "0.24.0"
tokio = { version = "1", features = ["signal","rt", "net", "macros", "rt-multi-thread", "tracing", "io-util", "net", "rt", "time", "signal"] }
serde = { version = "^1.0", features = ["derive"] }
bincode = "1.3"
tokio-util = { version = "0.7.0", features = ["full", "compat"] }
tokio-stream = { version = "0.1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3.1", default-features = false, features = ["fmt", "ansi", "env-filter", "tracing-log"] }
futures = { version = "0.3.28", features = ["thread-pool"]}
bytes = "1.4.0"
serde_json = "1.0.140"
clap = { version = "4.4.2", features = ["derive", "string"] }
bitcoin = { version="0.32.5",features=["serde"]}
bitcoin_hashes = { version = "0.3.2" }
shellexpand = "3.1.0"
num = { version = "0.4.1", features = ["serde", "rand"] }
rand = "0.8"
secp256k1 = {version = "0.28.2",features = ["serde"]}
libp2p = { version = "0.55.0", features = ["identify", "quic", "tokio","ping","macros","kad","dns","request-response","floodsub"] }
toml = "0.8.22"
jsonrpsee = {version = "0.25.1",features = ["full"]}
async-trait = "0.1.88"
sqlx = {version="0.8.6",features=[ "sqlite",
  "macros",
  "chrono",
  "uuid","regexp","runtime-tokio","runtime-async-std","derive"]}
strum = { version = "0.26", features = ["derive"] }
if-addrs = "0.13"
anyhow = "1.0.100"
quickcheck = ">= 1.0.3, < 1.1"
quickcheck_macros = ">= 1.0.0, < 1.1"
aes-gcm = { version = "0.10.2", default-features = false, features = ["alloc", "aes"] }
criterion = "0.3"
hashbrown = "0.15.5"
iai = "0.1"
rayon-core = "=1.12.1"
primitive-types = "0.13.1"
key-utils = "1.2.0"
byteorder = "1.2.7"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
trait-variant = "0.1.2"